[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-zoo"
version = "0.1.0"
description = "Pure registries + contracts + runners for a pluggable Model Zoo"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Your Team", email = "team@example.com" }]
keywords = ["mlops", "orchestration", "registry", "metrics", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed"
]
dependencies = [
  "seaborn>=0.13",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pymc",
  "pandas",
  "packaging>=23.0"
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
mcp = ["httpx>=0.27", "anyio>=4"]
pipeline = ["prefect>=2"]

[project.scripts]
mzoo = "model_zoo.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_zoo"]

[tool.hatch.version]
path = "src/model_zoo/__about__.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
